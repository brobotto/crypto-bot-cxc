[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot-cxc"
version = "0.1.0"
description = "Backtest-first crypto trading bot research and implementation workspace."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ccxt>=4.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
]
spike-b = [
  "vectorbt>=1.0,<2.0",
  "pandas>=2.2,<3.0",
]
spike-a = [
  "freqtrade>=2026.4,<2027.0",
]
spike-d = [
  "nautilus_trader>=1.226,<2.0",
]

[project.scripts]
cxc-download-ohlcv = "crypto_bot_cxc.cli.download_ohlcv:main"
cxc-spike-c-backtest = "crypto_bot_cxc.cli.spike_c_backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
