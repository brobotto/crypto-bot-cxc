strategy:
  primary: ema_trend
  symbols:
    - BTC/USDT
  timeframe: 1h
  fast_period: 2
  slow_period: 4
  warmup_period: 4

regime:
  adx_trend_threshold: 25
  adx_sideways_threshold: 20
  high_vol_multiplier: 1.5
  squeeze_multiplier: 0.5
  min_volume_ratio: 0.3
  max_spread_bps: 50

risk:
  risk_per_trade: 0.50
  atr_multiplier: 2.0
  daily_loss_limit: 0.20
  max_drawdown: 0.50
  max_consecutive_losses: 3
  max_open_positions: 1
  capital_reserve: 0.00

execution:
  default_fee_rate: 0
  basic_slippage_rate: 0
  conservative_slippage_rate: 0.001
  next_candle_execution: true
